<!doctype html>
<html lang="ml" data-page="customer-dashboard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f33">
  <meta name="description" content="NIVORA customer dashboard">
  <title>NIVORA — Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="dashboard-page">
  <main id="dashboardLoading" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <p>Loading your NIVORA dashboard…</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__sbPrimaryFailed=true"></script>
  <script>
    if (window.__sbPrimaryFailed || !window.supabase) {
      document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\\/script>');
    }
  </script>
  <script src="supabase-config.js"></script>
  <script src="common.js"></script>
  <script src="portal.js"></script>
  <script>
    window.addEventListener("load", async () => {
      try {
        const s = await window.NV.session();
        if (!s) { window.location.replace("index.html"); return; }
        document.getElementById("dashboardLoading")?.remove();
        await window.NivoraPortal.openPortal();
      } catch (_) {
        window.location.replace("index.html");
      }
    });
  </script>
</body>
</html>
