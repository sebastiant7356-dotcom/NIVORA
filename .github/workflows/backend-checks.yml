name: Backend checks

on:
  push:
    branches:
      - main
      - feature/chat-first-72h
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check frontend JavaScript syntax
        run: node --check ../frontend/app.js && node --check ../frontend/common.js && node --check ../frontend/portal.js && node --check ../frontend/admin.js && node --check ../frontend/appeal.js
      - name: Run backend tests
        run: npm test
